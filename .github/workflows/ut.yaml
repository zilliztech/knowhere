name: Unit Test

# This workflow is triggered on pushes or pull request to the repository.
on:
  push:
    branches:
      - main
  pull_request:
    # File paths to consider in the event. Optional; defaults to all.
    paths:
      - "include/**"
      - "python/**"
      - "src/**"
      - "thirdparty/**"
      - "benchmark/**"
      - "cmake/**"
      - "!cmake/libs/libcardinal.cmake"
      - ".github/workflows/ut.yaml"
      - "CMakeLists.txt"
      - "!**.md"
      - "tests/**"

jobs:
  ut:
    name: ut on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'none'
      - name: Install Dependency
        run: |
          sudo apt update \
          && sudo apt install -y cmake g++ gcc libopenblas-openmp-dev libcurl4-openssl-dev libaio-dev libevent-dev python3 python3-pip lcov ccache \
          && pip3 install conan==1.61.0 \
          && (conan remote add default-conan-local https://milvus01.jfrog.io/artifactory/api/conan/default-conan-local || true)
      - name: Restore Cache
        uses: ./.github/actions/cache-restore
        with:
          os: ubuntu-22.04
      - name: Build
        run: |
          mkdir build && cd build \
          && conan install .. --build=missing -s build_type=Release -o with_ut=True -o with_diskann=True -o with_asan=True -s compiler.libcxx=libstdc++11 \
          && conan build .. \
          && ./Release/tests/ut/knowhere_tests
      - name: Save Cache
        uses: ./.github/actions/cache-save
        with:
          os: ubuntu-22.04

  ut-macos:
    name: ut on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'none'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependency
        run: |
          bash scripts/install_deps.sh
      - name: Restore Cache
        uses: ./.github/actions/cache-restore
        with:
          os: ${{ matrix.os }}
      - name: Prepare Conan Profile
        run: |
          brew install llvm@16
          export PATH="$(brew --prefix llvm@16)/bin:${PATH}"
          export CC="$(brew --prefix llvm@16)/bin/clang"
          export CXX="$(brew --prefix llvm@16)/bin/clang++"
          conan profile new default --detect --force
          conan profile update settings.compiler=clang default
          conan profile update settings.compiler.version=16 default
          conan profile update settings.compiler.libcxx=libc++ default
      - name: Build
        run: |
          export PATH="/opt/homebrew/opt/llvm@16/bin:$PATH"
          export CC="/opt/homebrew/opt/llvm@16/bin/clang"
          export CXX="/opt/homebrew/opt/llvm@16/bin/clang++"
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          mkdir build && cd build \
          && conan install .. --build=missing -s build_type=Release -o with_ut=True -s compiler=clang -s compiler.version=16 -s compiler.libcxx=libc++ \
          && conan build .. \
          && ./Release/tests/ut/knowhere_tests
      - name: Save Cache
        uses: ./.github/actions/cache-save
        with:
          os: ${{ matrix.os }}

  swig-build:
    name: python3 wheel
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'none'
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"
      - name: Install Dependency
        run: |
          sudo apt update \
          && sudo apt install -y cmake g++ gcc libopenblas-openmp-dev libaio-dev libcurl4-openssl-dev libevent-dev libgflags-dev python3 python3-pip python3-setuptools ccache unzip binutils patchelf \
          && pip3 install conan==1.61.0 pytest faiss-cpu 'numpy>=2,<3' wheel ml-dtypes \
          && (conan remote add default-conan-local https://milvus01.jfrog.io/artifactory/api/conan/default-conan-local || true) \
          && pip3 install -U setuptools
      - name: Restore Cache
        uses: ./.github/actions/cache-restore
        with:
          os: ubuntu-22.04
      - name: Build
        run: |
          mkdir build \
          && cd build \
          && conan install .. --build=missing -o with_diskann=True -s compiler.libcxx=libstdc++11 -s build_type=Release \
          && conan build ..
      - name: Save Cache
        uses: ./.github/actions/cache-save
        with:
          os: ubuntu-22.04
      - name: Build Portable Wheel
        run: |
          cd python && ./build_portable_wheel.sh
      - name: Install Wheel
        run: |
          cd python && pip3 install dist/*-manylinux*.whl
      - name: Test
        run: |
          pytest tests/python/test_index_with_random.py
